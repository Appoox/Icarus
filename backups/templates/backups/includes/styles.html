<style>
    .bk { --bk-ok: var(--w-color-positive-100); --bk-warn: var(--w-color-warning-100); --bk-bad: var(--w-color-critical-200); }
    .bk-section { margin-bottom: 2em; }
    .bk-section > h2 { font-size: 1.15em; margin: 0 0 0.75em; }
    .bk-meta { color: var(--w-color-text-meta); font-size: 0.85em; }
    .bk-meta code { white-space: nowrap; }
    /* The panel surface the cards use, so it reads in Wagtail's light and dark themes alike. */
    .bk-banner { border-radius: 8px; padding: 1em 1.25em; margin-bottom: 1.5em; color: var(--w-color-text-context); background: var(--w-color-surface-dashboard-panel, var(--w-color-surface-page)); border: 1px solid var(--w-color-border-furniture); border-left: 6px solid; }
    .bk-banner--ok { border-left-color: var(--bk-ok); }
    .bk-banner--warn { border-left-color: var(--bk-warn); }
    .bk-banner--bad { border-left-color: var(--bk-bad); }
    .bk-banner strong { font-size: 1.1em; display: block; margin-bottom: 0.25em; }
    .bk-banner--ok strong { color: var(--bk-ok); }
    .bk-banner--warn strong { color: var(--w-color-text-context); }
    .bk-banner--bad strong { color: var(--bk-bad); }
    .bk-banner ul { margin: 0.5em 0 0 1.2em; padding: 0; }
    .bk-actions { display: flex; flex-wrap: wrap; gap: 0.75em; align-items: center; margin-bottom: 0.5em; }
    .bk-actions form { margin: 0; }
    .bk-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1em; margin-bottom: 2em; }
    .bk-card { background: var(--w-color-surface-dashboard-panel, var(--w-color-surface-page)); border: 1px solid var(--w-color-border-furniture); border-radius: 8px; padding: 1em; }
    .bk-card__label { font-size: 0.75em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--w-color-text-meta); }
    .bk-card__value { font-size: 1.5em; font-weight: 800; margin: 0.2em 0; overflow-wrap: anywhere; }
    .bk-meter { background: var(--w-color-surface-field); border-radius: 4px; height: 8px; overflow: hidden; margin: 0.4em 0; }
    .bk-meter > span { display: block; height: 100%; background: var(--w-color-info-100); }
    .bk-log { background: #1d1f21; color: #e0e0e0; border-radius: 6px; padding: 1em; max-height: 420px; overflow: auto; font-size: 0.8em; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bk-tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.78em; font-weight: 700; white-space: nowrap; }
    .bk-tag--succeeded, .bk-tag--ok { background: var(--w-color-positive-50); color: var(--w-color-positive-100); }
    .bk-tag--failed, .bk-tag--fail { background: var(--w-color-critical-50); color: var(--w-color-critical-200); }
    .bk-tag--running, .bk-tag--queued, .bk-tag--info { background: var(--w-color-info-50); color: var(--w-color-info-100); }
    .bk-tag--warn { background: var(--w-color-warning-50); color: var(--w-color-text-label); }
    .bk table.listing td, .bk table.listing th { vertical-align: top; }
    .bk code.bk-cmd { user-select: all; white-space: nowrap; }
    .bk-error { color: var(--w-color-critical-200); }
    .bk details > summary { cursor: pointer; font-weight: 700; }
    .bk-steps li { margin-bottom: 0.6em; }
</style>
