{% load wagtailimages_tags wagtailcore_tags %}

<figure class="article-image size-{{ self.size }}{% if self.alignment == 'left' %} img-left{% elif self.alignment == 'right' %} img-right{% endif %}">
  {% if self.size == 'small' %}
    {% image self.image width-340 as img %}
  {% elif self.size == 'large' %}
    {% image self.image width-1000 as img %}
  {% else %}
    {% image self.image width-680 as img %}
  {% endif %}
  <img src="{{ img.url }}" alt="{% if self.alt_text %}{{ self.alt_text }}{% else %}{{ img.alt }}{% endif %}">
  {% if self.caption or self.credit %}
    <figcaption>
      {% if self.caption %}{{ self.caption|richtext }}{% endif %}
      {% if self.credit %}<span class="credit">{{ self.credit }}</span>{% endif %}
    </figcaption>
  {% endif %}
</figure>
