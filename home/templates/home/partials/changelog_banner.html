{% load i18n %}
{% if entry %}

<style>
  .sg-changelog {
    position: fixed;
    left: 1rem;
    right: 1rem;
    bottom: 1.75rem;
    margin-inline: auto;
    max-width: 34rem;
    z-index: 1000;
    padding: 1.5rem 1.75rem 1.6rem;
    background: rgba(255, 255, 255, 0.85);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(26, 42, 74, 0.12);
    border-top: 3px solid var(--red, #c8102e);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(26, 42, 74, 0.25);
    color: var(--navy, #1a2a4a);
    animation: sg-changelog-in 0.5s cubic-bezier(0.21, 0.9, 0.3, 1.1) both;
  }
  .sg-changelog__kicker {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--red, #c8102e);
    margin-bottom: 0.5rem;
  }
  .sg-changelog__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red, #c8102e);
    animation: sg-changelog-pulse 1.6s infinite cubic-bezier(0.4, 0, 0.6, 1);
  }
  .sg-changelog__title {
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1.45;
    margin: 0 2rem 0.6rem 0; /* right margin clears the close button */
  }
  .sg-changelog__items {
    margin: 0;
    padding-left: 1.2rem;
    font-size: 1rem;
    line-height: 1.75;
    color: rgba(26, 42, 74, 0.8);
  }
  .sg-changelog__items li + li {
    margin-top: 0.25rem;
  }
  .sg-changelog__dismiss {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    width: 2.1rem;
    height: 2.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: rgba(26, 42, 74, 0.55);
    font-size: 1.35rem;
    line-height: 1;
    cursor: pointer;
  }
  .sg-changelog__dismiss:hover,
  .sg-changelog__dismiss:focus-visible {
    background: rgba(26, 42, 74, 0.08);
    color: var(--navy, #1a2a4a);
  }
  @keyframes sg-changelog-in {
    from { opacity: 0; transform: translateY(1.25rem); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes sg-changelog-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sg-changelog,
    .sg-changelog__dot { animation: none; }
  }
  @media (max-width: 640px) {
    .sg-changelog {
      bottom: 1rem;
      padding: 1.25rem 1.35rem 1.35rem;
    }
    .sg-changelog__title { font-size: 1.15rem; }
  }
</style>

<aside class="sg-changelog"
       id="sg-changelog"
       data-changelog-id="{{ entry.id }}"
       hidden
       role="complementary"
       aria-label="{% translate 'പുതിയ മാറ്റങ്ങൾ' %}">
  <button type="button"
          class="sg-changelog__dismiss"
          id="sg-changelog-dismiss"
          aria-label="{% translate 'അടയ്ക്കുക' %}">&times;</button>
  <div class="sg-changelog__kicker">
    <span class="sg-changelog__dot" aria-hidden="true"></span>
    {% translate "പുതിയ മാറ്റങ്ങൾ" %}
  </div>
  <h3 class="sg-changelog__title">{{ entry.title }}</h3>
  {% if entry.items %}
  <ul class="sg-changelog__items">
    {% for item in entry.items %}<li>{{ item }}</li>{% endfor %}
  </ul>
  {% endif %}
</aside>

<script>
(function () {
  var el = document.getElementById('sg-changelog');
  if (!el) return;
  var id = el.dataset.changelogId;
  var KEY = 'sg-changelog-seen';
  // localStorage can throw (private modes, storage disabled); degrade to a
  // per-pageview banner rather than breaking the page.
  var read = function () {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  };
  var write = function (value) {
    try { localStorage.setItem(KEY, value); } catch (e) { /* no-op */ }
  };
  if (read() !== id) {
    el.hidden = false;
  }
  document.getElementById('sg-changelog-dismiss').addEventListener('click', function () {
    write(id);
    el.hidden = true;
  });
})();
</script>
{% endif %}
