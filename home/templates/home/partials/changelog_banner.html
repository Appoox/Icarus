{% load i18n %}
{% if entry %}

<style>
  .sg-changelog {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    z-index: 1000;
    max-width: 22rem;
    padding: 1.15rem 1.3rem 1.25rem;
    background: rgba(255, 255, 255, 0.8);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid rgba(26, 42, 74, 0.12);
    border-radius: 16px;
    box-shadow: 0 18px 44px rgba(26, 42, 74, 0.18);
    color: var(--navy, #1a2a4a);
    animation: sg-changelog-in 0.45s cubic-bezier(0.21, 0.9, 0.3, 1.1) both;
  }
  .sg-changelog__kicker {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--red, #c8102e);
    margin-bottom: 0.35rem;
  }
  .sg-changelog__title {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.45;
    margin: 0 1.5rem 0.5rem 0; /* right margin clears the close button */
  }
  .sg-changelog__items {
    margin: 0;
    padding-left: 1.1rem;
    font-size: 0.9rem;
    line-height: 1.7;
    color: rgba(26, 42, 74, 0.78);
  }
  .sg-changelog__items li + li {
    margin-top: 0.15rem;
  }
  .sg-changelog__dismiss {
    position: absolute;
    top: 0.55rem;
    right: 0.55rem;
    width: 1.8rem;
    height: 1.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: rgba(26, 42, 74, 0.55);
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
  }
  .sg-changelog__dismiss:hover,
  .sg-changelog__dismiss:focus-visible {
    background: rgba(26, 42, 74, 0.08);
    color: var(--navy, #1a2a4a);
  }
  @keyframes sg-changelog-in {
    from { opacity: 0; transform: translateY(1rem); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sg-changelog { animation: none; }
  }
  @media (max-width: 640px) {
    .sg-changelog {
      left: 1rem;
      right: 1rem;
      bottom: 1rem;
      max-width: none;
    }
  }
</style>

<aside class="sg-changelog"
       id="sg-changelog"
       data-changelog-id="{{ entry.id }}"
       hidden
       role="complementary"
       aria-label="{% translate 'പുതിയ മാറ്റങ്ങൾ' %}">
  <button type="button"
          class="sg-changelog__dismiss"
          id="sg-changelog-dismiss"
          aria-label="{% translate 'അടയ്ക്കുക' %}">&times;</button>
  <div class="sg-changelog__kicker">{% translate "പുതിയ മാറ്റങ്ങൾ" %}</div>
  <h3 class="sg-changelog__title">{{ entry.title }}</h3>
  {% if entry.items %}
  <ul class="sg-changelog__items">
    {% for item in entry.items %}<li>{{ item }}</li>{% endfor %}
  </ul>
  {% endif %}
</aside>

<script>
(function () {
  var el = document.getElementById('sg-changelog');
  if (!el) return;
  var id = el.dataset.changelogId;
  var KEY = 'sg-changelog-seen';
  // localStorage can throw (private modes, storage disabled); degrade to a
  // per-pageview banner rather than breaking the page.
  var read = function () {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  };
  var write = function (value) {
    try { localStorage.setItem(KEY, value); } catch (e) { /* no-op */ }
  };
  if (read() !== id) {
    el.hidden = false;
  }
  document.getElementById('sg-changelog-dismiss').addEventListener('click', function () {
    write(id);
    el.hidden = true;
  });
})();
</script>
{% endif %}
