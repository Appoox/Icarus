{% extends "wagtailadmin/base.html" %}
{% load i18n %}
{% block titletag %}{{ title }}{% endblock %}
{% block content %}
    {% include "wagtailadmin/shared/header.html" with title=title icon="warning" %}
    <div class="nice-padding">
        <p>{{ description }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="button no">{{ action_label }}</button>
            <a href="{{ cancel_url }}" class="button button-secondary">{% translate "റദ്ദാക്കുക" %}</a>
        </form>
    </div>
{% endblock %}
