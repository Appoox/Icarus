services:
  db:
    image: pgvector/pgvector:pg18-trixie

    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icarus}
      POSTGRES_USER: ${POSTGRES_USER:-icarus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Handy for connecting a local DB client during development.
      # Remove in production if nothing outside the Docker network needs it.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icarus} -d ${POSTGRES_DB:-icarus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
  bouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-icarus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-icarus}
      DB_ADMIN_PASSWORD: ${BOUNCER_ADMIN_PASSWORD:?set BOUNCER_ADMIN_PASSWORD in .env}
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-icarus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-icarus}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - static_volume:/Icarus/static
      - media_volume:/Icarus/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_volume:/srv/static:ro
      - media_volume:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  static_volume:
  media_volume:
  caddy_data:
  caddy_config:
