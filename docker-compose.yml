services:
  db:
    image: pgvector/pgvector:pg18-trixie

    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - dbnet

  bouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_NAME}
      DB_ADMIN_PASSWORD: ${BOUNCER_ADMIN_PASSWORD}
      AUTH_TYPE: scram-sha-256
      # SESSION pooling is deliberate and important here. This project uses
      # channels_postgres, which relies on LISTEN/NOTIFY. Transaction- or
      # statement-mode pooling would return the listening connection to the
      # pool between statements and silently break realtime notifications.
      POOL_MODE: session
      # Bound how many server connections pgbouncer opens against Postgres.
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dbnet
      - webnet

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: icarus-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # App now connects THROUGH the bouncer (bouncer:6432), never straight to
      # db:5432. The environment block wins over anything in .env, so this is
      # the effective DSN.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@bouncer:5432/${POSTGRES_NAME}
      DB_HOST: bouncer
      DB_PORT: "5432"
    volumes:
      - static_volume:/Icarus/static
      - media_volume:/Icarus/media
      - model_volume:/Icarus/models
    depends_on:
      # bouncer starts after db is healthy; web starts after bouncer. If the
      # pool isn't accepting connections on the very first tick, the container
      # restart policy retries migrate cleanly.
      bouncer:
        condition: service_started
    networks:
      - webnet

  # ── django_q worker + scheduler ──────────────────────────────────────────
  # setup_page_lock_schedule (run in web's CMD) registers a django_q Schedule,
  # but a Schedule only ever FIRES while a `qcluster` process is running. With
  # no qcluster service, the page-lock job - and every other django_q task -
  # gets created and then never executes. This service reuses web's image and
  # just runs a different command. Remove it only if you run qcluster elsewhere.
  qcluster:
    image: icarus-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@bouncer:5432/${POSTGRES_NAME}
      DB_HOST: bouncer
      DB_PORT: "5432"
    # Background tasks may write generated files (e.g. TTS audio) into media.
    volumes:
      - media_volume:/Icarus/media
    command: python manage.py qcluster
    depends_on:
      bouncer:
        condition: service_started
    networks:
      - webnet

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_volume:/srv/static:ro
      - media_volume:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
  dbnet:
    driver: bridge
    internal: true

volumes:
  pgdata:
  static_volume:
  media_volume:
  model_volume:
  caddy_data:
  caddy_config: