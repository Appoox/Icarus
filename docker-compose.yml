# Shared logging policy for every service (a YAML anchor, used below as
# `logging: *default-logging`). Docker's default json-file driver never rotates:
# PgBouncer's log alone reached 14 GB and filled the disk on 2026-10-22. The
# `local` driver rotates and compresses, and `docker logs` / `docker compose
# logs` keep working. Set here rather than in /etc/docker/daemon.json so it is
# version-controlled and needs no dockerd restart.
# Logging options are fixed when a container is created. Editing this block
# changes every service's config, so the next deploy's `docker compose up -d`
# recreates all of them, db included (a brief database restart), and each
# container's existing log is deleted with it.
x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"  # rotate each file at 20 MB
    max-file: "5"    # keep 5 files: at most ~100 MB per container

services:
  db:
    image: pgvector/pgvector:pg18-trixie
    logging: *default-logging

    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - dbnet

  bouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    logging: *default-logging
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_NAME}
      DB_ADMIN_PASSWORD: ${BOUNCER_ADMIN_PASSWORD}
      AUTH_TYPE: scram-sha-256
      # SESSION pooling is deliberate and important here. This project uses
      # channels_postgres, which relies on LISTEN/NOTIFY. Transaction- or
      # statement-mode pooling would return the listening connection to the
      # pool between statements and silently break realtime notifications.
      POOL_MODE: session
      # Bound how many server connections pgbouncer opens against Postgres.
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "60"
      ADMIN_USERS: ${POSTGRES_USER}
      # PgBouncer logs one line per client connect and one per disconnect by
      # default. The Q2 cluster reconnects on every idle queue poll, and these
      # lines grew this container's Docker log to 14 GB and filled the disk
      # (2026-10-22 incident). Every client is our own app, on an internal
      # network, with the one DB user, so the lines carry little audit value.
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      # Still log real pooler failures (PgBouncer's default, made explicit).
      LOG_POOLER_ERRORS: "1"
      # The image writes pgbouncer.ini from these variables only when the
      # container is created: a restart or SIGHUP keeps the old file. Changing
      # this block changes the service config, so deploy.sh's `docker compose
      # up -d` recreates bouncer (dropping every client session; web, qcluster
      # and channels_postgres reconnect).
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dbnet
      - webnet

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: icarus-web:latest
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # App now connects THROUGH the bouncer (bouncer:6432), never straight to
      # db:5432. The environment block wins over anything in .env, so this is
      # the effective DSN.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@bouncer:5432/${POSTGRES_NAME}
      DB_HOST: bouncer
      DB_PORT: "5432"
      # Offline GeoIP DB lives on a shared named volume (seeded at boot, refreshed
      # monthly by qcluster). Keep this path in sync with the qcluster service.
      GEOIP_PATH: /Icarus/geoip
    volumes:
      - static_volume:/Icarus/static
      - media_volume:/Icarus/media
      - model_volume:/Icarus/models
      - geoip_volume:/Icarus/geoip
    # /healthz answers 200 only when Django and the database both respond
    # (Icarus/health.py). start_period covers the boot steps in the
    # Dockerfile CMD (collectstatic, migrate, GeoIP download).
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    # A runaway request (e.g. a huge PDF render) gets this container killed
    # and restarted instead of starving the database. Override in .env.
    mem_limit: ${WEB_MEM_LIMIT:-3g}
    depends_on:
      # bouncer starts after db is healthy; web starts after bouncer. If the
      # pool isn't accepting connections on the very first tick, the container
      # restart policy retries migrate cleanly.
      bouncer:
        condition: service_started
    networks:
      - webnet

  # ── django_q worker + scheduler ──────────────────────────────────────────
  # setup_page_lock_schedule (run in web's CMD) registers a django_q Schedule,
  # but a Schedule only ever FIRES while a `qcluster` process is running. With
  # no qcluster service, the page-lock job - and every other django_q task -
  # gets created and then never executes. This service reuses web's image and
  # just runs a different command. Remove it only if you run qcluster elsewhere.
  qcluster:
    image: icarus-web:latest
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@bouncer:5432/${POSTGRES_NAME}
      DB_HOST: bouncer
      DB_PORT: "5432"
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_CREDENTIALS_JSON}
      # Same shared GeoIP volume as web; the monthly refresh schedule runs here.
      GEOIP_PATH: /Icarus/geoip
    # Background tasks may write generated files (e.g. TTS audio) into media.
    volumes:
      - media_volume:/Icarus/media
      - model_volume:/Icarus/models
      - geoip_volume:/Icarus/geoip
      - /opt/Icarus/shared:/opt/Icarus/shared:ro
    command: python manage.py qcluster
    # TTS, PDF rendering and embedding run here; cap them so they can't
    # starve the database. Override in .env.
    mem_limit: ${QCLUSTER_MEM_LIMIT:-4g}
    depends_on:
      bouncer:
        condition: service_started
    networks:
      - webnet

  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/maintenance:/srv/maintenance:ro
      - static_volume:/srv/static:ro
      - media_volume:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
  dbnet:
    driver: bridge
    internal: true

volumes:
  pgdata:
  static_volume:
  media_volume:
  model_volume:
  geoip_volume:
  caddy_data:
  caddy_config: