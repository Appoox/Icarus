# ── Upstream: the Django/Wagtail ASGI app ────────────────────────────────
# web:8000 = the compose service "web" on port 8000. MUST match the bind port
# in your Dockerfile CMD (daphne/gunicorn -b 0.0.0.0:8000). Change if it differs.
upstream icarus {
    server web:8000;
}

# ── WebSocket upgrade mapping (Django Channels) ──────────────────────────
# Resolves to "upgrade" for a WS handshake, "close" for ordinary HTTP, so we
# never send a bogus Connection: upgrade on plain requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Port 80: ACME challenge + redirect everything else to HTTPS ──────────
server {
    listen 80;
    server_name sasthragathy.org www.sasthragathy.org;

    # certbot --webroot writes the proof token here; Let's Encrypt fetches it
    # over plain HTTP. This must stay reachable and un-redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: the real site ──────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name sasthragathy.org www.sasthragathy.org;

    ssl_certificate     /etc/letsencrypt/live/sasthragathy.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sasthragathy.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Wagtail admin uploads full back-issue PDFs; default 1M cap is too low.
    client_max_body_size 100M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Static served straight from disk, bypassing Django. alias REPLACES the
    # /static/ prefix with this path (unlike root, which appends).
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # location /media/ {
    #     alias /srv/media/;
    #     expires 7d;
    #     add_header Cache-Control "public";
    # }

    location / {
        proxy_pass http://icarus;
        proxy_http_version 1.1;                          # required for WebSockets
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;     # drives SECURE_PROXY_SSL_HEADER
        proxy_read_timeout 3600s;                        # keep idle editorial WS alive
        proxy_send_timeout 3600s;
    }
}
